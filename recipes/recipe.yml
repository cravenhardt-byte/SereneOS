# yaml-language-server: $schema=https://blue-build.org
name: SereneOS
description: A clean, simple Bazzite spin built for pure AMD gaming bliss.

# Base image switched to stable AMD/Intel GNOME variant
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  # 1. This WIPES OUT Firefox completely from the core system
  - type: dnf
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # 2. This INSTALLS Brave, Discord, LACT, Amethyst, and Steam
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Your specified Web Browser
          - com.brave.Browser
          
          # Custom source for Amethyst Mod Manager
          - https://github.io
          
          # Voice Chat, AMD GPU Controller (LACT), and Steam
          - com.discordapp.Discord
          - io.github.lact.LACT 
          - com.valvesoftware.Steam
      - scope: user

  - type: signing
